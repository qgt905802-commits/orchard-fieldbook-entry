<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>果序 · 小组入口</title><style>:root{font-family:-apple-system,"PingFang SC","Microsoft Yahei",sans-serif;color:#213a2f;background:#eef3eb}main{box-sizing:border-box;width:min(540px,94vw);margin:15vh auto;padding:clamp(25px,5vw,48px);background:#fbfcf8;border:1px solid #d2decf;border-radius:20px}h1{letter-spacing:-.055em;font-size:36px;margin:.3em 0}p,small{color:#5d7164;line-height:1.6}a{display:inline-block;text-decoration:none;border-radius:8px;padding:11px 15px;margin:5px 6px 0 0;background:#254d39;color:white}a+ a{background:#e4eddc;color:#284734}</style><main><small>Orchard Studio · 团队标注室</small><h1>果序工作台</h1><p>4,440 张果园照片，共用一个标注库。这里保存当前入口，连接中断时可以换一条线路。</p><div id="links"></div><p id="state" aria-live="polite">正在读取工作台地址…</p></main><script>
const localFallback=["https://harrison-vacuum-rogers-polo.trycloudflare.com/"];
const published='https://qgt905802-commits.github.io/orchard-fieldbook-entry/routes.json';
const api='https://api.github.com/repos/qgt905802-commits/orchard-fieldbook-entry/contents/routes.json';
function valid(s){try{const u=new URL(s);return u.protocol==='https:'&&!u.username&&!u.password&&u.pathname==='/'&&/^[a-z0-9-]+\.trycloudflare\.com$/.test(u.hostname)}catch{return false}}
async function get(url,raw){const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(5500),headers:raw?{Accept:'application/vnd.github.raw+json'}:{}});if(!r.ok)throw Error();const d=await r.json();if(!d.urls?.some(valid))throw Error();return d}
function show(list){const urls=[...new Set(list.filter(valid))];const el=document.getElementById('links');el.replaceChildren();urls.forEach((s,i)=>{const a=document.createElement('a');a.href=s;a.textContent=i?'备用线路':'打开标注工作台';el.append(a)});document.getElementById('state').textContent=urls.length?'请用分配的姓名和密码登录。':'工作台正在重新连接，请稍后刷新。'}
(async()=>{show(localFallback);try{let r;if(location.hostname==='qgt905802-commits.github.io'){r=await get('./routes.json?ts='+Date.now(),false)}else{r=await Promise.any([get(published+'?ts='+Date.now(),false),get(api+'?t='+Math.floor(Date.now()/30000),true)])}show(r.urls)}catch{}})();
</script></html>
